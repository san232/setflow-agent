[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "setflow-agent"
version = "0.1.0"
description = "A mood-curve playlist agent for a school assessment"
requires-python = ">=3.12"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not live_openai'"
pythonpath = ["."]
markers = ["live_openai: explicitly enabled tests that call the paid OpenAI API"]

